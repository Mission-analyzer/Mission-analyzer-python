<svg viewBox="-150 -550 3200 1000" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="-150" y="-550" width="3200" height="1000" fill="#0d1117"/>

  <!-- дві заборонені зони -->
  <circle cx="930.2" cy="0" r="300" fill="#e02020" fill-opacity="0.18" stroke="#e02020" stroke-width="3" stroke-dasharray="8,6"/>
  <circle cx="1932.0" cy="0" r="300" fill="#e02020" fill-opacity="0.18" stroke="#e02020" stroke-width="3" stroke-dasharray="8,6"/>
  <text x="930.2" y="-330" text-anchor="middle" fill="#e02020" font-size="30">НП 1</text>
  <text x="1932.0" y="-330" text-anchor="middle" fill="#e02020" font-size="30">НП 2</text>

  <!-- пряма лінія (неприпустима) -->
  <line x1="0" y1="0" x2="2862.2" y2="0" stroke="#888" stroke-width="3" stroke-dasharray="14,10"/>

  <!-- обхідний шлях -->
  <polyline points="0,0 833.1,284.9 881.0,297.0 930.2,301.0 1932.0,301.0 1981.2,297.0 2029.1,284.9 2862.2,0"
            fill="none" stroke="#00c853" stroke-width="6" stroke-linejoin="round"/>

  <!-- дуга між перешкодами (спільна дотична, підпис) -->
  <text x="1431.1" y="270" text-anchor="middle" fill="#00c853" font-size="26">спільна дотична між НП1 і НП2</text>

  <!-- центри перешкод -->
  <circle cx="930.2" cy="0" r="7" fill="#e02020"/>
  <circle cx="1932.0" cy="0" r="7" fill="#e02020"/>

  <!-- старт/фініш -->
  <circle cx="0" cy="0" r="14" fill="#2196f3"/>
  <text x="0" y="-30" text-anchor="middle" fill="#2196f3" font-size="32">A</text>
  <circle cx="2862.2" cy="0" r="14" fill="#2196f3"/>
  <text x="2862.2" y="-30" text-anchor="middle" fill="#2196f3" font-size="32">B</text>

  <text x="1431.1" y="-480" text-anchor="middle" fill="#e6edf3" font-size="32">Обхід ОБОХ перешкод одним розрахунком графа дотичних</text>
</svg>
